services:
  - type: web
    # Service name → public URL is https://<name>.onrender.com
    # (kept in sync with the og:image/og:url domain in frontend/index.html)
    name: multiplayer-snake-game
    runtime: docker
    region: oregon
    plan: free
    dockerContext: .
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: snake-db
          property: connectionString
      - key: PORT
        value: 8000
    autoDeploy: true

databases:
  - name: snake-db
    region: oregon
    plan: free
    databaseName: snake_db
    user: snake_user
